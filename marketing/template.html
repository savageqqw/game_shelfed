<!DOCTYPE html>
<!-- Source for the share image and ad banners. render.py swaps the body
     class (og / square / story) and screenshots it with headless Edge. -->
<html lang="uk">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Onest:wght@500;600;700&family=Unbounded:wght@700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0c0c0e;
    --paper: #f3efe4;
    --acid: #d4ff3a;
    --hot: #ff5b2e;
    --completed: #2ee6a6;
    --playing: #4da3ff;
    --planned: #ffb938;
    --dropped: #ff4f5e;
    --line: #2a2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body {
    position: relative;
    overflow: hidden;
    color: var(--paper);
    font-family: 'Onest', sans-serif;
    /* faint grid, the site's notebook texture */
    background-image:
      linear-gradient(rgba(243, 239, 228, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(243, 239, 228, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .brand { position: absolute; display: flex; align-items: center; }
  .brand .icon { display: block; }
  .brand .word { display: block; }

  .url-tape {
    position: absolute;
    background: var(--acid);
    color: var(--ink);
    font-weight: 700;
    letter-spacing: 0.08em;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--paper);
    transform: rotate(2deg);
  }

  .headline {
    position: absolute;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.035em;
  }
  .headline .line { display: block; }
  .marker {
    display: inline-block;
    margin-top: 0.14em;
    padding: 0.02em 0.18em 0.1em;
    background: var(--acid);
    color: var(--ink);
    transform: rotate(-1.4deg);
    box-shadow: 0.09em 0.09em 0 var(--paper);
  }

  .chips { position: absolute; display: flex; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    border: 3px solid #3a3a40;
    border-radius: 6px;
    font-weight: 700;
    color: var(--paper);
    background: rgba(12, 12, 14, 0.7);
  }
  .chip i { display: block; border-radius: 50%; }
  .c-completed i { background: var(--completed); }
  .c-playing i { background: var(--playing); }
  .c-planned i { background: var(--planned); }
  .c-dropped i { background: var(--dropped); }

  /* shelf: one spine per status, plus a face-out box */
  .shelf { position: absolute; }
  .row { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: center; }
  .spine {
    position: relative;
    border: 4px solid var(--ink);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    box-shadow: inset -8px 0 0 rgba(0, 0, 0, 0.18);
  }
  .spine span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }
  .spine::after {
    content: '';
    position: absolute;
    left: 18%;
    right: 18%;
    background: var(--ink);
    opacity: 0.85;
  }
  .s-completed { background: var(--completed); }
  .s-playing { background: var(--playing); }
  .s-planned { background: var(--planned); }
  .s-dropped { background: var(--dropped); }
  .s-lean { transform-origin: bottom right; transform: rotate(-9deg); }
  .face {
    position: relative;
    border: 4px solid var(--ink);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: var(--hot);
    overflow: hidden;
  }
  .face .art { position: absolute; inset: 0; }
  .face .sun { position: absolute; border-radius: 50%; background: var(--acid); border: 4px solid var(--ink); }
  .face .hill { position: absolute; left: -10%; right: -10%; bottom: -30%; border-radius: 50% 50% 0 0; background: var(--ink); }
  .face .title {
    position: absolute;
    left: 10%;
    right: 10%;
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    color: var(--ink);
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .face .pick {
    position: absolute;
    right: -4px;
    background: var(--ink);
    color: var(--acid);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  .plank { position: absolute; left: 0; right: 0; background: var(--paper); border-radius: 4px; }

  .tag {
    position: absolute;
    display: flex;
    align-items: center;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--acid);
    transform: rotate(-4deg);
  }
  .tag b { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: -0.02em; }
  .tag small { font-family: 'JetBrains Mono', monospace; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.2; }
  .barcode { display: flex; align-items: stretch; }
  .barcode span { display: block; background: var(--ink); }

  .sub { position: absolute; color: #c9c5ba; font-weight: 500; line-height: 1.45; }

  .cta {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--acid);
    color: var(--ink);
    font-weight: 800;
    border: 4px solid var(--ink);
    border-radius: 10px;
    box-shadow: 8px 8px 0 var(--paper);
  }
  .cta svg { display: block; width: 1em; height: 1em; }
  .url { position: absolute; color: #8d8a80; font-weight: 700; letter-spacing: 0.12em; }

  .ghost {
    position: absolute;
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 2px #232327;
    letter-spacing: -0.04em;
    line-height: 0.8;
  }

  /* ---------------- 1200 x 630: link preview ---------------- */
  body.og { width: 1200px; height: 630px; }
  .og .brand { left: 64px; top: 56px; gap: 14px; }
  .og .brand .icon { height: 54px; }
  .og .brand .word { height: 30px; }
  .og .url-tape { right: 60px; top: 56px; padding: 10px 16px 9px; font-size: 18px; }
  .og .headline { left: 64px; top: 172px; font-size: 60px; }
  .og .chips { left: 64px; top: 430px; gap: 10px; width: 660px; }
  .og .chip { height: 46px; padding: 0 14px; gap: 9px; font-size: 19px; }
  .og .chip i { width: 13px; height: 13px; }
  .og .shelf { right: 60px; bottom: 100px; width: 410px; height: 350px; }
  .og .ghost { left: -12px; bottom: -46px; font-size: 178px; }
  .og .cta, .og .url, .og .sub { display: none; }

  /* ---------------- 1080 x 1080: feed ad ---------------- */
  body.square { width: 1080px; height: 1080px; }
  .square .brand { left: 72px; top: 72px; gap: 14px; }
  .square .brand .icon { height: 60px; }
  .square .brand .word { height: 33px; }
  .square .url-tape { display: none; }
  .square .headline { left: 72px; top: 196px; font-size: 84px; }
  .square .chips { display: none; }
  .square .sub { left: 72px; top: 446px; width: 470px; font-size: 27px; }
  .square .shelf { right: 64px; top: 372px; width: 460px; height: 380px; }
  .square .cta { left: 72px; bottom: 132px; height: 104px; padding: 0 40px; gap: 16px; font-size: 38px; }
  .square .url { left: 76px; bottom: 70px; font-size: 22px; }
  .square .ghost { display: none; }

  /* ---------------- 1080 x 1920: stories / reels ---------------- */
  body.story { width: 1080px; height: 1920px; }
  .story .brand { left: 50%; top: 270px; gap: 16px; transform: translateX(-50%); }
  .story .brand .icon { height: 70px; }
  .story .brand .word { height: 39px; }
  .story .url-tape { display: none; }
  .story .headline { left: 0; right: 0; top: 430px; font-size: 88px; text-align: center; }
  .story .chips { left: 90px; right: 90px; top: 1440px; gap: 14px; justify-content: center; }
  .story .chip { height: 62px; padding: 0 22px; gap: 12px; font-size: 27px; }
  .story .chip i { width: 16px; height: 16px; }
  .story .sub { display: none; }
  .story .shelf { left: 50%; top: 760px; width: 620px; height: 560px; transform: translateX(-50%); }
  .story .cta { left: 90px; right: 90px; bottom: 236px; height: 124px; gap: 18px; font-size: 44px; }
  .story .url { left: 0; right: 0; bottom: 170px; text-align: center; font-size: 26px; }
  .story .ghost { display: none; }
</style>
</head>
<body class="og">
  <div class="ghost" aria-hidden="true">GAME SHELFED</div>

  <div class="brand">
    <img class="icon" src="../src/assets/logo-icon.svg" alt="" />
    <img class="word" src="../src/assets/logo-wordmark.svg" alt="Game Shelfed" />
  </div>
  <div class="url-tape mono">game-shelfed.pp.ua</div>

  <h1 class="headline">
    <span class="line">Усі твої ігри</span>
    <span class="line"><span class="marker">на одній полиці</span></span>
  </h1>

  <p class="sub">Відмічай пройдені, поточні й заплановані ігри. Імпорт зі Steam і сповіщення про знижки.</p>

  <div class="chips">
    <span class="chip c-completed"><i></i>Пройдено</span>
    <span class="chip c-playing"><i></i>Граю</span>
    <span class="chip c-planned"><i></i>В планах</span>
    <span class="chip c-dropped"><i></i>Кинуто</span>
  </div>

  <div class="shelf" id="shelf">
    <div class="row" id="row"></div>
    <div class="plank" id="plank"></div>
    <div class="tag" id="tag">
      <b id="tag-num">370k+</b>
      <small id="tag-label">ігор у<br />каталозі</small>
      <span class="barcode" id="barcode"></span>
    </div>
  </div>

  <div class="cta">
    Створити полицю безкоштовно
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </div>
  <div class="url mono">GAME-SHELFED.PP.UA</div>

<script>
  // shelf geometry scales with the box the layout gives it
  const shelf = document.getElementById('shelf')
  const W = shelf.offsetWidth
  const H = shelf.offsetHeight
  const k = W / 440
  const plankH = Math.round(14 * k)
  const plank = document.getElementById('plank')
  plank.style.height = plankH + 'px'
  plank.style.bottom = '0px'
  const row = document.getElementById('row')
  row.style.bottom = plankH + 'px'
  row.style.gap = Math.round(5 * k) + 'px'

  const spines = [
    { cls: 's-completed', label: 'ПРОЙДЕНО', w: 62, h: 0.78 },
    { cls: 's-playing', label: 'ГРАЮ', w: 56, h: 0.68 },
    { face: true, w: 168, h: 0.86 },
    { cls: 's-planned', label: 'В ПЛАНАХ', w: 60, h: 0.74 },
    { cls: 's-dropped s-lean', label: 'КИНУТО', w: 54, h: 0.6 }
  ]
  for (const s of spines) {
    const el = document.createElement('div')
    el.style.width = Math.round(s.w * k) + 'px'
    el.style.height = Math.round((H - plankH - 20 * k) * s.h) + 'px'
    if (s.face) {
      el.className = 'face'
      const fw = s.w * k
      el.innerHTML =
        '<div class="art"></div>' +
        `<span class="sun" style="width:${fw * 0.42}px;height:${fw * 0.42}px;right:${fw * 0.12}px;top:${fw * 0.5}px"></span>` +
        `<span class="hill" style="height:${fw * 0.9}px"></span>` +
        `<span class="title" style="top:${fw * 0.12}px;font-size:${fw * 0.18}px">SHELF<br>QUEST</span>` +
        `<span class="pick" style="bottom:${fw * 0.16}px;padding:${4 * k}px ${10 * k}px;font-size:${12 * k}px">ХІТ</span>`
    } else {
      el.className = 'spine ' + s.cls
      el.style.paddingTop = Math.round(14 * k) + 'px'
      el.innerHTML = `<span style="font-size:${Math.round(14 * k)}px">${s.label}</span>`
    }
    row.appendChild(el)
  }
  const spineStyle = document.createElement('style')
  spineStyle.textContent = `.spine::after { bottom: ${Math.round(16 * k)}px; height: ${Math.round(12 * k)}px; }`
  document.head.appendChild(spineStyle)

  const tag = document.getElementById('tag')
  tag.style.right = Math.round(-8 * k) + 'px'
  tag.style.bottom = Math.round(-44 * k) + 'px'
  tag.style.padding = `${Math.round(8 * k)}px ${Math.round(12 * k)}px`
  tag.style.gap = Math.round(10 * k) + 'px'
  document.getElementById('tag-num').style.fontSize = Math.round(24 * k) + 'px'
  document.getElementById('tag-label').style.fontSize = Math.round(10 * k) + 'px'
  const bc = document.getElementById('barcode')
  bc.style.height = Math.round(26 * k) + 'px'
  bc.style.gap = Math.max(1, Math.round(2 * k)) + 'px'
  const widths = [2, 1, 3, 1, 1, 2, 1, 3, 2, 1, 1, 2, 3, 1, 2, 1]
  for (const w of widths) {
    const b = document.createElement('span')
    b.style.width = Math.max(1, Math.round(w * k)) + 'px'
    bc.appendChild(b)
  }
</script>
</body>
</html>
