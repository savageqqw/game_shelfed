    <style>
      /* paints before the app bundle: dark page plus a small shelf animation */
      html { background: #0c0c0e; }
      body { margin: 0; }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        opacity: 0;
        animation: boot-in 0.3s ease 0.2s forwards;
      }
      .boot-shelf { position: relative; width: 100px; height: 66px; }
      .boot-box {
        position: absolute;
        bottom: 8px;
        width: 24px;
        border: 3px solid #0c0c0e;
        border-radius: 3px;
        box-sizing: border-box;
        animation: boot-drop 1.6s cubic-bezier(0.3, 1.35, 0.5, 1) infinite both;
      }
      .boot-b1 { left: 8px; height: 40px; background: #d4ff3a; }
      .boot-b2 { left: 36px; height: 54px; background: #ff5b2e; animation-delay: 0.14s; }
      .boot-b3 { left: 64px; height: 34px; background: #f3efe4; animation-delay: 0.28s; }
      .boot-plank { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; border-radius: 2px; background: #f3efe4; }
      .boot-label { font: 700 11px/1 Consolas, Menlo, monospace; letter-spacing: 0.32em; color: #77746c; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-drop {
        0% { transform: translateY(-70px); opacity: 0; }
        22% { transform: translateY(0); opacity: 1; }
        82% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(0); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-box { animation: none; } }
    </style>
    <script>
      // The home page's first catalog request starts here, while the app
      // bundle is still downloading; LibraryView picks the promise up.
      (function () {
        try {
          if (location.pathname !== '/' || /[?&]q=/.test(location.search)) return
          var seed = String(Math.floor(Math.random() * 12))
          window.__gsCatalog = {
            seed: seed,
            req: fetch('/api/games-search?q=&page=1&seed=' + seed)
              .then(function (r) { return r.ok ? r.json() : null })
              .catch(function () { return null })
          }
        } catch (e) { /* the app falls back to its own request */ }
      })()
    </script>

          "description": "Трекер ігор: каталог на 370 тисяч ігор, статуси пройдено, граю, в планах і кинуто, імпорт бібліотеки Steam і сповіщення про знижки."
        }
      ]
    }
    </script>

    <noscript>
      <h1>Game Shelfed: усі твої ігри на одній полиці</h1>
      <p>Каталог на 370 тисяч ігор. Став ігри на полицю зі статусом «пройдено», «граю», «в планах» або «кинуто», імпортуй бібліотеку Steam і отримуй сповіщення про знижки. Для роботи сайту потрібен JavaScript.</p>
